# logrotate-Konfiguration fuer den Analytics-Sync (Aufgabe 016 Teil D, 16.11.2026).
# Ziel auf dem VPS: /etc/logrotate.d/fuelofit-analytics (root:root 644).
#
# Kein copytruncate: sync.log wird je Lauf per logging.FileHandler NEU geoeffnet (jeder
# Cron-Aufruf ist ein frischer Python-Prozess), cron.out wird je Lauf per Shell-Umleitung
# (">>") neu geoeffnet - kein Prozess haelt die Datei dauerhaft offen, ein normales
# rename+create reicht.
#
# Testbeleg: logrotate -d -f /etc/logrotate.d/fuelofit-analytics (siehe Bericht 016 Teil D).

/home/fuelofit-analytics/app/sync.log
/home/fuelofit-analytics/app/cron.out
{
    weekly
    rotate 8
    compress
    missingok
    notifempty
    create 0664 fuelofit-analytics fuelofit-analytics
}
